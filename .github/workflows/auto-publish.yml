name: Auto-publish first-party plugins

# Third-party plugins are only listed after a human review. First-party packages under @vibedev-si/ may opt in with
# `autoPublish: true`: this job then records their newest stable npm release as a pull request, which lands once the
# Validate check passes. scripts/auto-publish.mjs still runs every curated-list check and refuses a release that would
# reach a new host or start a new program.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Record newer first-party releases
        run: node scripts/auto-publish.mjs --apply
      - name: Open a pull request when the list changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no first-party release to record"
            exit 0
          fi
          branch="auto/publish-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "VibeDev index bot"
          git config user.email "bot@vibedev.studio"
          git switch -c "$branch"
          git add plugins.yml reviews
          git commit -m "chore(index): record newer first-party releases"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(index): record newer first-party releases" \
            --body "Opened by the scheduled first-party auto-publish job. Every added version passed the curated-list checks; the review record is generated from the previous reviewed version. Merges automatically once Validate passes."
          gh pr merge "$branch" --squash --auto
