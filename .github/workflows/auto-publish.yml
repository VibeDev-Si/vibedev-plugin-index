name: Auto-publish plugins

# Plugins are listed after a human review, except releases that pass the automatic rules of plugins that opt in:
# first-party packages marked `autoPublish: true` (published by the accounts under `firstParty`) and third-party
# packages with an `autoFollow` block (within the declared update range, after policy.autoFollowWaitHours, from the
# declared npm accounts or provenance, and adding no host, environment variable, code-hint category or dependency to
# the last version reviewed by hand). scripts/auto-publish.mjs applies those rules and every curated-list check. This
# job then lands the change and publishes the index without a person:
#   1. push the `auto/publish` branch and open (or reuse) its pull request;
#   2. wait for the pull request's Validate run, which reports the required `validate` check, approving it when GitHub
#      holds it for approval (the bot counts as a first-time contributor); when GitHub starts no run, dispatch
#      Validate on the branch, which reports the same check on the same commit;
#   3. merge exactly that commit once Validate passed;
#   4. deploy Pages: a merge made with GITHUB_TOKEN starts no push workflow, so pages.yml is dispatched explicitly.
# Releases the rules refuse are listed in one open issue labelled auto-publish-refused, kept current by every run and
# closed when none is left; they wait for a human review. The run fails only when the registry or a tarball cannot be
# read or the list fails its checks.
# The download server copies the published index on its own timer (see "Mirroring to the VibeDev download server" in
# README.md). Opening the pull request needs "Allow GitHub Actions to create and approve pull requests" enabled for the
# organization and the repository.
# Besides the hourly schedule, which GitHub often starts hours late, the download server dispatches this workflow
# within 10 minutes of an npm release the published index lacks (server/plugin_index_trigger.py).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Record releases the automatic rules take
        id: record
        # An error must not hold back the releases that passed: land them, then fail the run at the end.
        run: |
          if node scripts/auto-publish.mjs --apply --refusals-output "$RUNNER_TEMP/refused.md" --refusals-count-file "$RUNNER_TEMP/refused-count.txt"; then
            echo "errored=false" >> "$GITHUB_OUTPUT"
          else
            echo "errored=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Land the change through the auto/publish pull request
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "no release to record"
            exit 0
          fi
          branch=auto/publish
          git config user.name "VibeDev index bot"
          git config user.email "bot@vibedev.studio"
          git switch -c "$branch"
          git add plugins.yml reviews
          git commit -m "chore(index): record releases the automatic rules take"
          sha=$(git rev-parse HEAD)
          since=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)
          # Only this step and the issue step hold a token; the steps before ran repository and dependency code without one.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push --force origin "HEAD:refs/heads/$branch"
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --repo "$REPO" --base main --head "$branch" \
              --title "chore(index): record releases the automatic rules take" \
              --body "Opened by the scheduled auto-publish job. Each added version passed the autoPublish (first party) or autoFollow (third party) rules and every curated-list check; its review record says what was carried over from which reviewed version. The job runs Validate on this branch and merges the validated commit."
          fi

          # find_run <workflow> <branch> <event> <head sha> <created after> <tries>: print the newest matching run id.
          find_run() {
            local id=""
            for _ in $(seq 1 "$6"); do
              id=$(gh run list --repo "$REPO" --workflow "$1" --branch "$2" --event "$3" --limit 20 \
                --json databaseId,headSha,createdAt \
                --jq "[.[] | select(.headSha == \"$4\" and .createdAt >= \"$5\")][0].databaseId // empty")
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 10
            done
            return 1
          }

          # The pull request's own Validate run is the check the branch protection counts. GitHub may hold it for
          # approval (the bot counts as a first-time contributor); approving it lets it run. Only when GitHub starts
          # no such run is Validate dispatched on the branch, which reports the same check on the same commit.
          if validate=$(find_run validate.yml "$branch" pull_request "$sha" "$since" 9); then
            if [ "$(gh run view "$validate" --repo "$REPO" --json conclusion --jq .conclusion)" = "action_required" ]; then
              gh api -X POST "repos/$REPO/actions/runs/$validate/approve" >/dev/null \
                || { echo "::error::Validate on the auto/publish pull request awaits approval; approve run $validate by hand"; exit 1; }
            fi
          else
            gh workflow run validate.yml --repo "$REPO" --ref "$branch"
            validate=$(find_run validate.yml "$branch" workflow_dispatch "$sha" "$since" 30) \
              || { echo "::error::Validate did not start on $branch at $sha"; exit 1; }
          fi
          gh run watch "$validate" --repo "$REPO" --exit-status --interval 20
          gh pr merge "$branch" --repo "$REPO" --squash --match-head-commit "$sha" \
            --subject "chore(index): record releases the automatic rules take"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null || echo "branch $branch was already removed"

          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          since=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run pages.yml --repo "$REPO" --ref main
          pages=$(find_run pages.yml main workflow_dispatch "$main" "$since" 30) \
            || { echo "::error::Pages did not start at $main"; exit 1; }
          gh run watch "$pages" --repo "$REPO" --exit-status --interval 20
          echo "published=$main" >> "$GITHUB_OUTPUT"
      - name: Keep the issue of refused releases current
        # Runs after a failed landing too, so refusals are reported whatever happened to the releases that passed.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/refused-count.txt" ]; then
            echo "auto-publish.mjs wrote no refusal report"
            exit 0
          fi
          count=$(cat "$RUNNER_TEMP/refused-count.txt")
          cat "$RUNNER_TEMP/refused.md" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --repo "$REPO" --state open --label auto-publish-refused --json number --jq '.[0].number // empty')
          if [ "$count" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" --comment "No release is refused as of $(date -u '+%F %H:%M') UTC. 截至 $(date -u '+%F %H:%M') UTC 没有被拒的版本。"
            fi
            echo "no refused release"
            exit 0
          fi
          gh label create auto-publish-refused --repo "$REPO" --color D93F0B --description "Releases the automatic rules refused; review them by hand" --force
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/refused.md"
          else
            gh issue create --repo "$REPO" --title "自动收录被拒的版本 / Releases auto-publish refused" --label auto-publish-refused --body-file "$RUNNER_TEMP/refused.md"
          fi
      - name: Fail on errors
        if: steps.record.outputs.errored == 'true'
        run: |
          echo "::error::The registry or a tarball could not be read, or the list failed its checks; see the step 'Record releases the automatic rules take'."
          exit 1
