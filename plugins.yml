# VibeDev 精选插件索引 — 收录清单（schema 1）
# VibeDev curated plugin index — the source list (schema 1).
#
# 只有这里记录过审核的精确版本才会进入 dist/index.json；插件发新版不会自动收录。
# 例外：标了 autoPublish: true 的第一方包（@vibedev-si/）由定时任务把 npm 上的新稳定版写成本清单条目，
# 每个新版本仍要通过全部机器检查才会构建进索引。
# Only the exact versions reviewed and recorded here reach dist/index.json; a new upstream release is never
# included automatically. See README.md for the inclusion criteria and the review checklist.

schema: 1

index:
  title:
    en: VibeDev Curated Plugins
    zh: VibeDev 精选插件
  description:
    en: Community plugins reviewed by the VibeDev team. Only reviewed, exact versions are listed; plugins are third-party code.
    zh: 经 VibeDev 团队审核的社区插件。只收录审核过的精确版本；插件仍是第三方代码。

target:
  # The DSH runtime version VibeDev ships (@deepseek-ai/dsh-app-boot). Every listed version must be compatible with it.
  # 当前 VibeDev 内置的 DSH 版本。每个收录版本都必须与之兼容。
  dsh: 0.2.1-rc.2

policy:
  # Largest unpacked package accepted without review.sizeException (20 MiB).
  maxUnpackedBytes: 20971520
  # Icons up to this size are embedded in index.json as data: URLs; larger icons are published under icons/.
  inlineIconBytes: 16384

categories:
  tools: { en: Tools, zh: 工具与能力 }
  ui: { en: Interface, zh: 界面增强 }
  theme: { en: Themes, zh: 主题与外观 }
  session: { en: Sessions, zh: 会话与消息 }
  memory: { en: Memory, zh: 记忆 }
  workflow: { en: Workflow, zh: 工作流 }
  browser: { en: Browser and Web, zh: 浏览器与网页 }
  docs: { en: Documents, zh: 文档 }
  media: { en: Media, zh: 媒体 }
  dev: { en: Development, zh: 开发 }
  usage: { en: Usage and Cost, zh: 用量与费用 }
  integration: { en: Integrations, zh: 服务集成 }

# Curator tags (metadata.labels). Capability labels (network, child-process, writes-files, writes-config,
# install-scripts) are added by the build from the review records and cannot be declared here.
labels:
  vibedev: { en: Made by VibeDev, zh: VibeDev 出品 }

# 收录的插件。每个版本都有审核记录；候选和暂缓的插件见 CANDIDATES.md。
# Listed plugins. Every version carries its review record; candidates and deferred plugins are in CANDIDATES.md.
# capabilities.network: host names the plugin contacts; "*" means sites the user or the agent chooses.
plugins:
  - name: "@wxg-prc-cpg/browser-skill-dsh-plugin"
    category: browser
    tags: []
    maintainer: https://github.com/Tencent/BrowserSkill/issues
    display:
      title:
        en: BrowserSkill
        zh: BrowserSkill 浏览器操作
      description:
        en: >-
          Lets the agent drive a real browser through Tencent BrowserSkill. Install first, both at version 0.3.3: the bsk
          command-line tool on PATH and the BrowserSkill extension connected in Chrome or Edge (github.com/Tencent/BrowserSkill,
          Quick start); if VibeDev then reports that it cannot find bsk, restart VibeDev or set the plugin's bskPath to the
          full path. It drives your signed-in browser, so the agent can act on sites where you are logged in: use a separate
          browser profile for it and keep the extension's confirmation settings on. The plugin launches bsk processes, and
          the browser visits the sites the agent chooses. Session recovery records are kept in ~/.bsk. The bsk background
          service updates itself every 30 minutes by default; set the environment variable BSK_AUTO_UPDATE=off to keep it
          at the version that matches this plugin.
        zh: >-
          让 Agent 通过腾讯 BrowserSkill 操作真实浏览器。安装前先装好两样，版本都要是 0.3.3：bsk 命令行工具（加入 PATH），以及
          Chrome 或 Edge 里已连接 bsk 的 BrowserSkill 扩展（见 github.com/Tencent/BrowserSkill 的 Quick start）；如果 VibeDev
          提示找不到 bsk，重启 VibeDev，或在插件配置的 bskPath 里填它的完整路径。它操作的是你已登录的浏览器，Agent 能在你已登录的网站里
          操作：建议给它单独建一个浏览器配置，并保持扩展里的确认开关打开。插件会启动 bsk 进程，浏览器会访问 Agent 选择的网站。会话恢复
          记录保存在 ~/.bsk。bsk 的后台服务默认每 30 分钟自动更新一次；设置环境变量 BSK_AUTO_UPDATE=off 可以让它停在与插件匹配的版本。
    versions:
      - version: 0.3.3
        integrity: sha512-YleWGGDN7re7arDD8PVgcIuTeMXHne4JKilLaKmvO9L1EzvOKNKVXZ3eHq7CXbgF7uooxRjnYviMH2QMRqZv+A==
        review:
          reviewer: VibeDev
          date: 2026-10-19
          license: MIT
          testedOn: [0.2.1-rc.2]
          capabilities:
            network: ["*"]
            files: write
            config: none
            childProcess: [bsk]
          installScripts: []
          notes: >-
            No dependencies, no install scripts, no npm provenance. The plugin itself opens no network connection (client
            requests stay on its own /bsk-observation routes). Its only child process is the user-installed bsk CLI
            (config bskPath, default "bsk" from PATH; not shipped in the package), started without a shell as
            `bsk <command> --json`: `bsk --version` at every load, bsk_* tool calls (tools appear after the browser-skill
            skill is invoked), and `bsk screenshot --session <id> --out <temp>/bsk-obs-*.png` every 1.5 s for active
            sessions. Files: start journal under ~/.bsk/dsh-starts (or BSK_HOME), thumbnails in the temp directory.
            Registers the bundled browser-skill skill and GET/POST routes under /bsk-observation; stops browser sessions of
            archived DSH sessions. No credentials, settings writes, telemetry, eval, or self-update. Trial on DSH
            0.2.1-rc.2 (installBundle in a temporary profile): installed and ACTIVE after hot install and after restart;
            no outbound connection. Browser trial in the VibeDev desktop app (DSH 0.2.1-rc.2) with bsk CLI 0.3.3 (release
            sha256 verified, Authenticode signed by Tencent Technology (Shenzhen)) and extension 0.3.3 in Chrome 155:
            session start, navigate, observe, screenshot, fill, click (radio, checkbox), form submit, load wait and stop all
            worked on public pages; CLI timings: session start 0.21 s, observe about 0.09 s, screenshot 0.14 s, navigation
            1.0 to 1.3 s. The bsk daemon listens on 127.0.0.1 only and, outside this pinned package, updates itself every
            30 minutes unless BSK_AUTO_UPDATE=off.
  - name: dsh-context
    category: usage
    tags: []
    maintainer: https://github.com/bowenliang123/dsh-context/issues
    display:
      description:
        en: >-
          Context window, token usage, and cost panel for DSH sessions. Uses your DeepSeek API key (DEEPSEEK_API_KEY) to
          query your balance at api.deepseek.com, loads model prices from models.dev, and asks npm for its own newer
          version to show an update hint; it never installs updates itself.
        zh: >-
          DSH 会话的上下文窗口、Token 用量与费用面板。会用你的 DeepSeek API key（DEEPSEEK_API_KEY）向 api.deepseek.com
          查询余额，从 models.dev 获取模型价格，并向 npm 查询自身新版本以显示更新提示；不会自行安装更新。
    versions:
      - version: 0.73.2
        integrity: sha512-C1UQrNogShFx/uYpg/aED0Qd7x7oX8Tay2gwfhYy89VxDOg1sPIeML3yttvFDfzPLeGpP1JU9qksTNyYoY8YAA==
        review:
          reviewer: VibeDev
          date: 2026-10-19
          license: Apache-2.0
          testedOn: [0.2.1-rc.2]
          capabilities:
            network: [api.deepseek.com, models.dev, registry.npmjs.org, registry.npmmirror.com]
            files: write
            config: read
            childProcess: []
          installScripts: []
          notes: >-
            npm provenance: built from github.com/bowenliang123/dsh-context tag v0.73.2 (commit 2ee5c96). One dependency
            (zod), no install scripts. Host: POST routes /api/dsh-context/{balance,skills,fleet,attachment,detail,backfill}
            on the connection bridge; no child process. Balance: only when the panel calls /api/dsh-context/balance, it
            reads Settings to find the DeepSeek entry (falls back to the first entry with an apiKeyEnv), resolves that
            credential, and sends it as a Bearer token to <baseURL>/user/balance. In the VibeDev web composition the only
            such entry is web-deepseek-api, so the trial saw exactly one read of DEEPSEEK_API_KEY and one request to
            https://api.deepseek.com/v1/tools/user/balance (the balance may show nothing there). Files: links or copies
            image attachments inside DSH's attachment storage for display. Browser: models.dev/api.json price book; hourly
            registry.npmjs.org and registry.npmmirror.com /dsh-context/latest for an update hint linking to GitHub
            releases (newer versions are not reviewed here). No telemetry, eval, or self-update. Trial on DSH 0.2.1-rc.2:
            installed and ACTIVE after hot install and after restart; no outbound connection at startup.
  - name: "@vibedev-si/dsh-remote"
    category: integration
    tags: [vibedev]
    autoPublish: true
    maintainer: https://github.com/VibeDev-Si/dsh-remote/issues
    display:
      title:
        en: VibeDev Remote
        zh: VibeDev 远程访问
      description:
        en: >-
          Lets your phone reach this computer's VibeDev from outside: the desktop dials out to the VibeDev relay, and
          after signing in with the same account and verifying the phone, the phone continues sessions, sends prompts,
          reads history, answers approvals and opens files inside the workspaces you select. Remote access is off until
          the owner enables it, and every connection can be refused or revoked on the desktop. Needs a VibeDev account
          with remote access granted; the computer must stay online, and nothing runs in the cloud.
        zh: >-
          让手机在外网连到这台电脑上的 VibeDev：电脑主动出站连接 VibeDev 中继，手机用同一账号登录并完成可信验证后，可以继续会话、
          发送消息、查看历史、处理审批，并读取你在电脑上选定工作区里的文件。远程访问默认关闭，由电脑所有者开启；每次连接都可以在电脑上
          拒绝或随时撤销。需要 VibeDev 账号且已开通远程权限，电脑必须保持在线，不会在云端运行任何东西。
    versions:
      - version: 0.1.12
        integrity: sha512-UHf97RcksLUb7CEVR2IUZCZo4JJxuVLwBe3zopndqKG3yPmgapyO8whUTI5chZ5lyo8DVDYdhbxkKlkMOSXe1Q==
        review:
          reviewer: VibeDev
          date: 2026-10-29
          license: MIT
          testedOn: [0.2.1-rc.2]
          capabilities:
            network: [vibedev.studio, remote.vibedev.studio:24443, github.com, 127.0.0.1]
            files: write
            config: write
            childProcess: [python3, cloudflared, nginx, certbot, systemctl]
          installScripts: []
          notes: >-
            First-party connector published from github.com/VibeDev-Si/dsh-remote tag v0.1.12; dependency tree is ws,
            qrcode and @deepseek-ai/schemastery, none with install scripts. No telemetry, no eval, no self-update.
            Remote access starts disabled and is enabled only from the desktop owner's own page: the plugin then holds
            one outbound WSS to remote.vibedev.studio:24443 (ticket in the Authorization header; frames are the
            dsh-mobile-v1 payloads, 1 MiB cap) and never listens on a public port. Sign-in is browser PKCE against
            vibedev.studio, and the short-lived ticket, JWKS refresh and lease-validated connection all come from that
            origin; tokens, grants, the operation journal and the relay replay log live under the profile's
            vibedev-remote directory with 0600 files. Capabilities come from the account's remote grant and the owner's
            selection: conversation, sessions, history, tasks, approvals, files.read and files.write, intersected with a
            workspace fence so a phone can only touch the desktop owner's selected workspaces. Writes: workspace uploads
            staged for a Session, downloaded copies, and remote.json/operations.json; config writes: the Loader patch row
            this bundle ships and, from the phone, only enabling or disabling other installed bundles - installing,
            removing and settings edits are refused remotely, and this connector cannot be disabled from a phone.
            Child processes only exist behind opt-in desktop features: a root-owned python3 helper for the legacy LAN
            certificate flow (nginx/certbot/systemctl, Linux only) and the cloudflared binary downloaded from GitHub
            releases for the optional tunnel; neither runs on a default install. Trial: installBundle of 0.1.12 into the
            VibeDev desktop profile on DSH 0.2.1-rc.2 replaced a pinned 0.1.9 tarball, and the connector has since run
            there across restarts with a real account, phone pairing, history, approvals and file reads.
  - name: dsh-film
    category: media
    tags: [vibedev]
    maintainer: https://github.com/VibeDev-Si/dsh-film/issues
    display:
      title:
        en: VibeDev Film
        zh: VibeDev 影视工作台
      description:
        en: >-
          A canvas film workbench: script and storyboard canvas, image/video/audio generation, the Director stage and
          final editing, plus local scene detection with keyframes, clips and the original audio, and optional AI shot
          descriptions. Models and media go through the VibeDev account plugin, so no API key is entered here, and the
          bundled local server listens on 127.0.0.1 only and stops when VibeDev exits. Local processing needs FFmpeg:
          install it with your system package manager or from the workbench's own plugin market. The package ships the
          Bun runtime for three platforms, so it is large (about 45 MiB unpacked, one runtime installed per platform).
        zh: >-
          画布式影视工作台：剧本与分镜画布、图片/视频/音频生成、导演台和剪辑成片，还能本地切镜并提取关键帧、片段和原音轨，
          可选 AI 逐镜头描述与整段分析。模型与媒体统一走 VibeDev 账号插件，不需要在这里填写 API Key；随包的本地服务只监听
          127.0.0.1，VibeDev 退出后自行关闭。本地处理需要 FFmpeg：用系统包管理器安装，或在工作台里的插件市场下载。
          包装了三个平台的 Bun 运行时，所以体积较大（解包约 45 MiB，每个平台只装一个）。
    versions:
      - version: 0.8.0
        integrity: sha512-DlmR0u0BZw2CtHHeYDDWs3yKGp5UAD9XQJvwAX4aCk5/RmN4NzA8f2xPVRZjrs9i3SzgVLAA+QNCB8eCz2fRXg==
        review:
          reviewer: VibeDev
          date: 2026-10-29
          license: MIT
          testedOn: [0.2.1-rc.2]
          capabilities:
            network: [127.0.0.1]
            files: write
            config: none
            childProcess: [bun, ffmpeg, ffprobe]
          installScripts: []
          sizeException: >-
            解包 46,981,566 B（44.8 MiB），超过 20 MiB 上限：包内随附三个平台的 Bun 运行时（用来启动本地 Film 服务）、
            FFmpeg 与文档解析 Worker，以及工作台 Web 产物和内置节点/工具/技能。这些是本地处理能力，不是可裁剪的依赖；
            Bun 可选依赖按平台只安装一个。Unpacks to 44.8 MiB because it ships the three platforms' Bun runtimes that run
            the local Film server, the FFmpeg and document-parsing workers, the workbench Web build and the built-in
            nodes/tools/skills. These are the local processing capability rather than trimmable dependencies, and only one
            platform's Bun package is installed per user.
          notes: >-
            First-party workbench published from github.com/VibeDev-Si/dsh-film tag v0.8.0; the workbench source is the
            private dsh-film-studio repository, workbench branch at ebed97a0 (tag dsh-film-v0.8.0). Runtime dependency is zod
            only; the optional @oven/bun-* packages are pinned 1.3.13 and carry no install scripts. No npm provenance: the
            OIDC release job was refused by GitHub billing, so 0.8.0 was published from the machine after the tarball was
            verified byte for byte against the tested archive. The host half spawns the bundled Bun to run the local Film
            server on an ephemeral 127.0.0.1 port with three stdio pipes and a parent-process lifeline, and the package
            contains no other host name; model and media traffic is handed to @vibedev-si/dsh-vibedev on the host side, so
            Film never holds an API key. ffmpeg/ffprobe come from PATH, FFMPEG_PATH/FFPROBE_PATH, or a build the user installs
            into the plugin data directory. The workbench executes the node, tool and skill scripts in that data directory
            (tools.ts imports tool plugins from file paths) and re-seeds its own built-in copies when the build revision
            changes; it writes no DSH settings or profile configuration. ToonFlow's anonymous usage reporter is still in the
            bundle, but account-managed mode returns before it registers: no settings read, no timer, no request, and the
            privacy panel cannot enable it. The same mode hides the bundled ToonFlow provider and plugin-store screens, so
            the api.toonflow.net, api.apimart.ai and similar hosts found by the static scan are unreachable from the Film UI.
            Windows evidence: installed through pluginManager.installBundle of this exact archive into the desktop profile on
            DSH 0.2.1-rc.2 and active after restart; canvas, nodes, asset library, project ZIP import/export, read-only
            document text extraction, image/video/audio generation, local frame analysis with report viewing and AI shot
            descriptions were all used there, and a save during analysis no longer cancels it. Host-style launch returned
            FFmpeg status and a real ffprobe in hundreds of milliseconds and the server exited by itself after its parent was
            killed. Repository checks: 167 automated checks pass and verify-package.mjs installs the archive into a fresh
            directory, starts it, and sees 401 without a session and 303 for the session link. Limits: Windows only; the
            1 GB/10,000-entry archive and 100 MB document boundaries were not exercised; there is no read-only open button
            and no document-to-node import in this version.
